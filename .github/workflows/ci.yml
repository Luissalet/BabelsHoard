name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create venv and install
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./.venv/Scripts/pip install --disable-pip-version-check -q -r requirements-lock.txt
            ./.venv/Scripts/pip install --disable-pip-version-check -q pytest pytest-asyncio
          else
            ./.venv/bin/pip install --disable-pip-version-check -q -r requirements-lock.txt
            ./.venv/bin/pip install --disable-pip-version-check -q pytest pytest-asyncio
          fi

      - name: Install probe npm deps (TypeScript compiler API)
        working-directory: babels_hoard/probes
        run: npm ci --no-audit --no-fund

      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./.venv/Scripts/python -m pytest -q
          else
            ./.venv/bin/python -m pytest -q
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build

  windows-launcher:
    # Exercises the double-click path on real Windows: start.ps1 creates the
    # venv, installs the lock, builds the UI, starts the app and waits for
    # /api/health; stop.ps1 must then stop it (venv launcher + child).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start with scripts/start.ps1
        shell: powershell
        run: |
          $launcher = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','scripts/start.ps1','-NoBrowser' -PassThru -RedirectStandardOutput launcher.out -RedirectStandardError launcher.err
          $ok = $false
          for ($i = 0; $i -lt 300; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8811/api/health -TimeoutSec 2; if ($h.service -eq 'babels-hoard') { $ok = $true; break } } catch { }
            if ($launcher.HasExited -and -not $ok) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            Write-Host '--- launcher output'; Get-Content launcher.out -ErrorAction SilentlyContinue
            Write-Host '--- launcher errors'; Get-Content launcher.err -ErrorAction SilentlyContinue
            throw 'Babel''s Hoard did not become healthy'
          }
          if (-not (Test-Path faustus-plugin.json)) { throw 'manifest missing' }
      - name: Stop with scripts/stop.ps1
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stop.ps1
          Start-Sleep -Seconds 3
          $alive = $true
          try { Invoke-RestMethod http://127.0.0.1:8811/api/health -TimeoutSec 2 | Out-Null } catch { $alive = $false }
          if ($alive) { throw 'still running after stop.ps1' }
